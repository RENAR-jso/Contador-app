<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Asistencia en Tiempo Real</title>
    <link rel="manifest" href="manifest.json">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 min-h-screen text-white flex flex-col items-center justify-between p-4">

    <!-- Encabezado -->
    <header class="w-full max-w-md text-center py-4">
        <span class="px-3 py-1 bg-indigo-500/20 text-indigo-300 text-xs font-semibold rounded-full border border-indigo-500/30">
            SISTEMA MULTI-DISPOSITIVO
        </span>
        <h1 class="text-2xl font-bold mt-2">Contador de Asistencia</h1>
        <p id="role-indicator" class="text-xs text-slate-400 mt-1">Selecciona tu rol para comenzar</p>
    </header>

    <!-- Contenedor Principal -->
    <main class="w-full max-w-md bg-slate-800/80 backdrop-blur-md rounded-2xl p-6 shadow-2xl border border-slate-700">

        <!-- 1. Pantalla de Selección de Rol -->
        <div id="view-role" class="space-y-4 text-center">
            <h2 class="text-lg font-semibold text-slate-200 mb-2">¿Cuál es tu función hoy?</h2>
            
            <button onclick="setRole('acomodador')" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
                <span>🚶‍♂️</span> Acomodador (Presencial)
            </button>
            
            <button onclick="setRole('audiovideo')" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
                <span>🎙️</span> Audio y Video (Zoom / Telegram)
            </button>
            
            <button onclick="setRole('coordinador')" class="w-full py-4 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
                <span>📊</span> Coordinador (Vista General)
            </button>

            <hr class="border-slate-700 my-4">

            <!-- Botón para Iniciar Nueva Reunión -->
            <button onclick="resetAllCounters()" class="w-full py-3 bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 border border-rose-500/30 font-semibold rounded-xl transition text-xs flex items-center justify-center gap-2">
                <span>🔄</span> Iniciar Nueva Reunión (Reiniciar a 0)
            </button>
        </div>

        <!-- 2. Panel de Acomodador -->
        <div id="view-acomodador" class="hidden text-center space-y-6">
            <div class="bg-slate-900/60 p-6 rounded-xl border border-slate-700">
                <span class="text-xs text-emerald-400 font-bold uppercase tracking-wider">Presencial</span>
                <div id="val-presencial" class="text-6xl font-extrabold my-3 text-white">0</div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="adjust('presencial', -1)" class="py-4 bg-rose-600/80 hover:bg-rose-600 text-2xl font-bold rounded-xl shadow transition active:scale-95">-1</button>
                <button onclick="adjust('presencial', 1)" class="py-4 bg-emerald-600 hover:bg-emerald-500 text-2xl font-bold rounded-xl shadow transition active:scale-95">+1</button>
            </div>
            
            <div class="pt-4 border-t border-slate-700 flex justify-between items-center text-xs">
                <button onclick="changeRole()" class="text-slate-400 underline">Cambiar de rol</button>
                <button onclick="resetAllCounters()" class="text-rose-400 hover:text-rose-300 font-medium">🔄 Reiniciar todo</button>
            </div>
        </div>

        <!-- 3. Panel de Audio y Video -->
        <div id="view-audiovideo" class="hidden space-y-6">
            <!-- Zoom -->
            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 text-center">
                <span class="text-xs text-blue-400 font-bold uppercase tracking-wider">Zoom</span>
                <div id="val-zoom" class="text-4xl font-extrabold my-2 text-white">0</div>
                <div class="grid grid-cols-2 gap-2 mt-2">
                    <button onclick="adjust('zoom', -1)" class="py-2 bg-rose-600/80 hover:bg-rose-600 font-bold rounded-lg">-1</button>
                    <button onclick="adjust('zoom', 1)" class="py-2 bg-blue-600 hover:bg-blue-500 font-bold rounded-lg">+1</button>
                </div>
            </div>
            <!-- Telegram -->
            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 text-center">
                <span class="text-xs text-sky-400 font-bold uppercase tracking-wider">Telegram</span>
                <div id="val-telegram" class="text-4xl font-extrabold my-2 text-white">0</div>
                <div class="grid grid-cols-2 gap-2 mt-2">
                    <button onclick="adjust('telegram', -1)" class="py-2 bg-rose-600/80 hover:bg-rose-600 font-bold rounded-lg">-1</button>
                    <button onclick="adjust('telegram', 1)" class="py-2 bg-sky-600 hover:bg-sky-500 font-bold rounded-lg">+1</button>
                </div>
            </div>

            <div class="pt-2 border-t border-slate-700 flex justify-between items-center text-xs">
                <button onclick="changeRole()" class="text-slate-400 underline">Cambiar de rol</button>
                <button onclick="resetAllCounters()" class="text-rose-400 hover:text-rose-300 font-medium">🔄 Reiniciar todo</button>
            </div>
        </div>

        <!-- 4. Panel de Coordinador / Resumen -->
        <div id="view-coordinador" class="hidden space-y-4 text-center">
            <h2 class="text-sm font-semibold text-slate-300">Resumen en Tiempo Real</h2>
            <div class="grid grid-cols-3 gap-2 bg-slate-900/60 p-3 rounded-xl border border-slate-700 text-xs">
                <div>Presencial: <span id="tot-presencial" class="font-bold text-emerald-400">0</span></div>
                <div>Zoom: <span id="tot-zoom" class="font-bold text-blue-400">0</span></div>
                <div>Telegram: <span id="tot-telegram" class="font-bold text-sky-400">0</span></div>
            </div>
            <div class="bg-indigo-950/60 p-6 rounded-xl border border-indigo-500/40">
                <span class="text-xs text-indigo-300 font-bold uppercase tracking-wider">Total General Asistencia</span>
                <div id="val-total" class="text-6xl font-extrabold my-2 text-white">0</div>
            </div>

            <div class="pt-2 border-t border-slate-700 flex justify-between items-center text-xs">
                <button onclick="changeRole()" class="text-slate-400 underline">Cambiar de rol</button>
                <button onclick="resetAllCounters()" class="text-rose-400 hover:text-rose-300 font-medium">🔄 Reiniciar todo</button>
            </div>
        </div>

    </main>

    <!-- Pie de página -->
    <footer class="w-full max-w-md text-center py-4 text-xs text-slate-500">
        Conectado en la nube con Firebase Realtime Database
    </footer>

    <!-- Lógica de Firebase y Roles -->
    <script>
        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyB03_-v52rp51OTf24aGSjS9RPN8awpvxc",
            authDomain: "contador-de-asistencia-51b07.firebaseapp.com",
            databaseURL: "https://contador-de-asistencia-51b07-default-rtdb.firebaseio.com",
            projectId: "contador-de-asistencia-51b07",
            storageBucket: "contador-de-asistencia-51b07.firebasestorage.app",
            messagingSenderId: "565032901751",
            appId: "1:565032901751:web:f46df9b2f3d5349b873a72"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const dbRef = db.ref('asistencia');

        function setRole(role) {
            document.getElementById('view-role').classList.add('hidden');
            document.getElementById('view-acomodador').classList.add('hidden');
            document.getElementById('view-audiovideo').classList.add('hidden');
            document.getElementById('view-coordinador').classList.add('hidden');

            if (role === 'acomodador') {
                document.getElementById('view-acomodador').classList.remove('hidden');
                document.getElementById('role-indicator').innerText = 'Modo: Acomodador';
            } else if (role === 'audiovideo') {
                document.getElementById('view-audiovideo').classList.remove('hidden');
                document.getElementById('role-indicator').innerText = 'Modo: Audio y Video';
            } else if (role === 'coordinador') {
                document.getElementById('view-coordinador').classList.remove('hidden');
                document.getElementById('role-indicator').innerText = 'Modo: Coordinador (Vista General)';
            }
        }

        function changeRole() {
            document.getElementById('view-acomodador').classList.add('hidden');
            document.getElementById('view-audiovideo').classList.add('hidden');
            document.getElementById('view-coordinador').classList.add('hidden');
            document.getElementById('view-role').classList.remove('hidden');
            document.getElementById('role-indicator').innerText = 'Selecciona tu rol para comenzar';
        }

        function adjust(tipo, cantidad) {
            dbRef.child(tipo).transaction(function(currentVal) {
                let actual = currentVal || 0;
                let nuevo = actual + cantidad;
                return nuevo < 0 ? 0 : nuevo;
            });
        }

        // Función para reiniciar todos los contadores a 0
        function resetAllCounters() {
            if (confirm("¿Estás seguro de que deseas reiniciar todos los contadores a cero?")) {
                dbRef.set({
                    presencial: 0,
                    zoom: 0,
                    telegram: 0
                });
            }
        }

        // Escuchar cambios en tiempo real desde Firebase
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val() || { presencial: 0, zoom: 0, telegram: 0 };
            const p = data.presencial || 0;
            const z = data.zoom || 0;
            const t = data.telegram || 0;
            const total = p + z + t;

            // Actualizar interfaz
            document.getElementById('val-presencial').innerText = p;
            document.getElementById('val-zoom').innerText = z;
            document.getElementById('val-telegram').innerText = t;

            document.getElementById('tot-presencial').innerText = p;
            document.getElementById('tot-zoom').innerText = z;
            document.getElementById('tot-telegram').innerText = t;
            document.getElementById('val-total').innerText = total;
        });
    </script>
</body>
</html>
